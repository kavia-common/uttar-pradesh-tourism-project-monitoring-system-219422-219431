# Bind to preview port
server.port=3001

# Set a recognizable application name
spring.application.name=project-monitoring-backend

# Graceful shutdown (optional)
server.shutdown=graceful

# =========================
# Database configuration
# Uses environment variables with safe defaults and container service name
# Required env vars (recommended): DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# Defaults:
#   DB_HOST -> project_monitoring_database (service/container name)
#   DB_PORT -> 5432
#   DB_NAME -> uptourism_pms
#   DB_USER -> (no default; must be set in environment)
#   DB_PASSWORD -> (no default; must be set in environment)
spring.datasource.url=jdbc:postgresql://${DB_HOST:project_monitoring_database}:${DB_PORT:5432}/${DB_NAME:uptourism_pms}?sslmode=disable
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# For initial development, allow Hibernate to create/update tables for the minimal entity.
# In production, prefer Flyway/Liquibase with 'validate'.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Connection pool (Hikari) basic safety limits
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:30000}

# Actuator exposure for health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
